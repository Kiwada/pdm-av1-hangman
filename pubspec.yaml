name: hangman_game
description: Jogo da Forca offline desenvolvido com Flutter e Dart.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hangman_entries.json

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/pressstart2p-regular.ttf

    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
